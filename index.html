<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Izbori Administracija</title>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border-color: #334155;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
        }

        html, body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navigacija */
        .header {
            background: rgba(30, 41, 59, 0.95);
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 { margin: 0; font-size: 18px; color: var(--accent-green); }
        .btn-back {
            background: transparent; border: 1px solid var(--text-muted);
            color: var(--text-main); padding: 5px 10px; border-radius: 6px;
            display: none; cursor: pointer;
        }

        .container {
            padding: 20px 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Prikazi (Views) */
        .view { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login */
        .login-box {
            background: var(--bg-card); padding: 30px 20px;
            border-radius: 12px; border: 1px solid var(--border-color);
            text-align: center; margin-top: 50px;
        }
        .login-box input {
            width: 100%; padding: 15px; margin: 15px 0;
            background: var(--bg-dark); border: 1px solid var(--accent-blue);
            color: white; border-radius: 8px; font-size: 16px; text-align: center;
            box-sizing: border-box;
        }

        /* Dugmići opšti */
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; color: white;
            transition: 0.2s; box-sizing: border-box;
        }
        .btn-blue { background: var(--accent-blue); }
        .btn-green { background: var(--accent-green); }
        .btn-orange { background: var(--accent-orange); }
        .btn:active { transform: scale(0.98); }

        /* Meni ekran */
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .menu-buttons .btn { padding: 20px; font-size: 16px; }

        /* Statistika opštine */
        .stats-box {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 15px;
        }
        .stats-box h3 { text-align: center; margin-top: 0; color: var(--text-muted); font-size: 14px; text-transform: uppercase; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .stat-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        .stat-item h2 { margin: 0; color: var(--accent-blue); font-size: 24px; }
        .stat-item p { margin: 5px 0 0 0; font-size: 11px; color: var(--text-muted); }
        .stat-full { grid-column: span 2; }
        .stat-full h2 { color: var(--accent-orange); }

        /* Forme (Izlaznost i Rezultati) */
        select, input[type="number"], input[type="text"] {
            width: 100%; padding: 12px 15px; margin-bottom: 15px;
            background-color: var(--bg-dark); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 8px;
            font-size: 16px; outline: none; box-sizing: border-box;
        }
        select:focus, input:focus { border-color: var(--accent-blue); }
        
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }

        .party-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); padding: 8px 10px;
            border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color);
        }
        .party-row label { flex: 1; font-size: 12px; line-height: 1.2; margin: 0; padding-right: 10px; color: var(--text-main); }
        .party-row input { width: 80px; margin-bottom: 0; text-align: center; border-color: var(--accent-orange); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Baza - Admin</h1>
        <button id="btn-back" class="btn-back" onclick="prikaziEkran('view-menu')">Nazad</button>
    </div>

    <div class="container">
        
        <!-- EKRAN 1: PRIJAVA -->
        <div id="view-login" class="view active">
            <div class="login-box">
                <h2>Unesite lozinku</h2>
                <input type="password" id="input-password" placeholder="Lozinka">
                <button class="btn btn-blue" onclick="proveriLozinku()">Prijavi se</button>
                <p id="login-error" style="color:#ef4444; font-size:14px; display:none;">Pogrešna lozinka!</p>
            </div>
        </div>

        <!-- EKRAN 2: GLAVNI MENI -->
        <div id="view-menu" class="view">
            <div class="menu-buttons">
                <button class="btn btn-blue" onclick="otvoriIzlaznost()">Unos Izlaznosti</button>
                <button class="btn btn-orange" onclick="otvoriRezultate()">Unos Rezultata</button>
                <button class="btn btn-green" onclick="otvoriIzvestaj()">Izveštaj o izborima</button>
            </div>

            <div class="stats-box">
                <h3>Statistika na nivou opštine</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <h2 id="stat-ukupno">0</h2>
                        <p>UKUPNO BIRAČA</p>
                    </div>
                    <div class="stat-item">
                        <h2 id="stat-izaslo">0</h2>
                        <p>IZAŠLO BIRAČA</p>
                    </div>
                    <div class="stat-item stat-full">
                        <h2 id="stat-procenat">0%</h2>
                        <p>PROSEČNA IZLAZNOST</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- EKRAN 3: UNOS IZLAZNOSTI -->
        <div id="view-izlaznost" class="view">
            <h2 style="margin-top: 0; color: var(--accent-blue);">Unos Izlaznosti</h2>
            <select id="select-izlaznost-mesto" onchange="popuniIzlaznostFormu()">
                <option value="" disabled selected>Izaberite biračko mesto...</option>
                <!-- Opcije se generišu iz JS-a -->
            </select>

            <div id="forma-izlaznost" style="display:none; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
                <div class="form-group">
                    <label>Ukupan broj birača na ovom mestu:</label>
                    <input type="number" id="input-ukupan-broj" placeholder="Unesi ukupan broj">
                </div>
                <div class="form-group">
                    <label>Izašlo birača do ovog preseka:</label>
                    <input type="number" id="input-izaslo" placeholder="Unesi broj izašlih">
                </div>
                <div class="form-group">
                    <label>Vreme preseka:</label>
                    <select id="select-vreme">
                        <option value="06:00">06:00 h</option>
                        <option value="07:00">07:00 h</option>
                        <option value="08:00">08:00 h</option>
                        <option value="09:00">09:00 h</option>
                        <option value="10:00">10:00 h</option>
                        <option value="11:00">11:00 h</option>
                        <option value="12:00">12:00 h</option>
                        <option value="13:00">13:00 h</option>
                        <option value="14:00">14:00 h</option>
                        <option value="15:00">15:00 h</option>
                        <option value="16:00">16:00 h</option>
                        <option value="17:00">17:00 h</option>
                        <option value="18:00">18:00 h</option>
                        <option value="19:00">19:00 h</option>
                        <option value="20:00">20:00 h</option>
                        <option value="21:00">21:00 h</option>
                        <option value="22:00">22:00 h (Kraj)</option>
                    </select>
                </div>
                <button class="btn btn-green" id="btn-save-izlaznost" onclick="sacuvajIzlaznost()">Sačuvaj Izlaznost</button>
            </div>
        </div>

        <!-- EKRAN 4: UNOS REZULTATA -->
        <div id="view-rezultati" class="view">
            <h2 style="margin-top: 0; color: var(--accent-orange);">Unos Rezultata</h2>
            <select id="select-rezultati-mesto" onchange="popuniRezultatiFormu()">
                <option value="" disabled selected>Izaberite biračko mesto...</option>
                <!-- Opcije se generišu iz JS-a -->
            </select>

            <div id="forma-rezultati" style="display:none; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
                <p style="font-size:12px; color:var(--text-muted); margin-top:0;">Unesite broj glasova za svaku stranku. Prazna polja se računaju kao 0.</p>
                <div id="lista-stranaka">
                    <!-- Stranke se generišu iz JS-a -->
                </div>
                <button class="btn btn-green" id="btn-save-rezultati" onclick="sacuvajRezultate()" style="margin-top: 15px;">Sačuvaj Rezultate</button>
            </div>
        </div>

        <!-- EKRAN 5: IZVEŠTAJ -->
        <div id="view-izvestaj" class="view">
            <h2 style="margin-top: 0; color: var(--accent-green);">Izveštaj o izborima</h2>
            <div id="izvestaj-content">
                <!-- Sadržaj izveštaja generiše JS -->
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        const LOZINKA = "1234"; // OVDE MENJAŠ LOZINKU
        let globalData = {};

        const politickeListe = [
            "Aleksandar Vučić - Ujedinjena Srbija", "Ivica Dačić - Faktor stabilnosti", "Studentska lista - Studenti pobeđuju",
            "Radim Ljajić - Ljudski", "Savez vojvođanskih Mađara - Dr Balint Pastor", "Usame Zukorlić - Pokret za ujedinjenje",
            "Ruska stranka - Srbija u Briksu - Slobodan Nikolić", "Autentična desnica - Dr Miloš Jovanović", "Evropska Srbija - Marinika Tepić - Zdravko Ponoš",
            "SDA Sanžaka - Čuvari Sandžaka", "Bogoljub Karić - Pokret snaga Srbije", "Liberalno zelena stranka - Za slobodnu i čistiju Srbiju",
            "Biram pravu - Biram budućnost - Koalicija snaga...", "Stranka rusko-srpskog jedinstva - Rusi i Srbi braća zauvek",
            "Ćale ovo je za tebe - Petar Đurić", "Vladimir Gajić - Alternativa za Srbiju", "Albanska koalicija", "Majka Srbija - Gruda"
        ];

        // LOGIKA ZA MENJANJE EKRANA (NAVIGACIJA)
        window.prikaziEkran = function(idEkrana) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(idEkrana).classList.add('active');
            
            const btnBack = document.getElementById('btn-back');
            if(idEkrana === 'view-login' || idEkrana === 'view-menu') {
                btnBack.style.display = 'none';
            } else {
                btnBack.style.display = 'block';
            }
        };

        window.proveriLozinku = function() {
            const unos = document.getElementById('input-password').value;
            if(unos === LOZINKA) {
                prikaziEkran('view-menu');
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        };

        window.otvoriIzlaznost = function() {
            document.getElementById('select-izlaznost-mesto').value = "";
            document.getElementById('forma-izlaznost').style.display = 'none';
            prikaziEkran('view-izlaznost');
        };

        window.otvoriRezultate = function() {
            document.getElementById('select-rezultati-mesto').value = "";
            document.getElementById('forma-rezultati').style.display = 'none';
            generisiPoljaZaStranke();
            prikaziEkran('view-rezultati');
        };

        window.otvoriIzvestaj = function() {
            generisiIzvestaj();
            prikaziEkran('view-izvestaj');
        };

        // GENERISANJE PADAJUĆIH MENIJA I STATISTIKE
        onValue(mestaRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            globalData = data;

            let sortiranaMesta = Object.keys(data).sort((a,b) => parseInt(data[a].broj) - parseInt(data[b].broj));
            
            let opcijeHtml = `<option value="" disabled selected>Izaberite biračko mesto...</option>`;
            let opstinaUpisano = 0;
            let opstinaIzaslo = 0;

            sortiranaMesta.forEach(id => {
                let mesto = data[id];
                opcijeHtml += `<option value="${id}">${mesto.broj}. ${mesto.naziv}</option>`;
                opstinaUpisano += parseInt(mesto.ukupan_broj) || 0;
                opstinaIzaslo += parseInt(mesto.izaslo) || 0;
            });

            // Čuvanje trenutnog izbora
            let trenIzlaznost = document.getElementById('select-izlaznost-mesto').value;
            let trenRezultati = document.getElementById('select-rezultati-mesto').value;

            document.getElementById('select-izlaznost-mesto').innerHTML = opcijeHtml;
            document.getElementById('select-rezultati-mesto').innerHTML = opcijeHtml;

            if(trenIzlaznost) document.getElementById('select-izlaznost-mesto').value = trenIzlaznost;
            if(trenRezultati) document.getElementById('select-rezultati-mesto').value = trenRezultati;

            // Osvežavanje statistike u meniju
            document.getElementById('stat-ukupno').innerText = opstinaUpisano;
            document.getElementById('stat-izaslo').innerText = opstinaIzaslo;
            let proc = opstinaUpisano > 0 ? ((opstinaIzaslo / opstinaUpisano) * 100).toFixed(1) : 0;
            document.getElementById('stat-procenat').innerText = proc + "%";

            // Osveži izveštaj uživo ako je otvoren
            if (document.getElementById('view-izvestaj').classList.contains('active')) {
                generisiIzvestaj();
            }
        });

        // LOGIKA ZA EKRAN: IZVEŠTAJ
        window.generisiIzvestaj = function() {
            if (!globalData) return;
            
            let opstinaUpisano = 0;
            let opstinaIzaslo = 0;
            let ukupniRezultati = {};
            politickeListe.forEach((_, i) => ukupniRezultati[i] = 0);
            
            let sortiranaMestaKeys = Object.keys(globalData).sort((a,b) => parseInt(globalData[a].broj) - parseInt(globalData[b].broj));
            let mestaHtml = "";

            sortiranaMestaKeys.forEach(id => {
                let mesto = globalData[id];
                let upisano = parseInt(mesto.ukupan_broj) || 0;
                let izaslo = parseInt(mesto.izaslo) || 0;
                
                opstinaUpisano += upisano;
                opstinaIzaslo += izaslo;
                
                let mestoRezultati = [];
                let mestoVazecih = 0;
                
                if(mesto.rezultati) {
                    Object.keys(mesto.rezultati).forEach(idx => {
                        let glasovi = parseInt(mesto.rezultati[idx]) || 0;
                        ukupniRezultati[idx] += glasovi;
                        if(glasovi > 0) {
                            mestoRezultati.push({ime: politickeListe[idx], glasovi: glasovi});
                            mestoVazecih += glasovi;
                        }
                    });
                }
                
                mestoRezultati.sort((a,b) => b.glasovi - a.glasovi);
                let mestoRezHtml = "";
                mestoRezultati.forEach(r => {
                    mestoRezHtml += `
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.05); padding:6px 0;">
                        <span style="font-size:12px; color:var(--text-muted);">${r.ime}</span>
                        <span style="font-weight:bold; color:var(--accent-blue);">${r.glasovi}</span>
                    </div>`;
                });
                
                let procenat = upisano > 0 ? ((izaslo / upisano)*100).toFixed(1) : 0;
                
                mestaHtml += `
                <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:15px; margin-bottom:15px;">
                    <h3 style="margin:0 0 10px 0; font-size:16px; color:var(--text-main);">${mesto.broj}. ${mesto.naziv}</h3>
                    <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.2); padding:8px; border-radius:6px; font-size:12px; margin-bottom:10px;">
                        <span>Upisano: <strong>${upisano}</strong></span>
                        <span>Izašlo: <strong style="color:var(--accent-orange);">${izaslo} (${procenat}%)</strong></span>
                    </div>
                    <div style="font-size:11px; color:var(--text-muted); margin-bottom:5px;">Važećih glasova: <strong style="color:white;">${mestoVazecih}</strong></div>
                    <div style="max-height: 180px; overflow-y: auto;">
                        ${mestoRezHtml ? mestoRezHtml : '<div style="font-size:12px; color:gray; font-style:italic;">Nema unetih rezultata</div>'}
                    </div>
                </div>`;
            });

            // Priprema ukupnih rezultata
            let totalRezArr = [];
            let ukupnoVazecih = 0;
            Object.keys(ukupniRezultati).forEach(idx => {
                if(ukupniRezultati[idx] > 0) {
                    totalRezArr.push({ime: politickeListe[idx], glasovi: ukupniRezultati[idx]});
                    ukupnoVazecih += ukupniRezultati[idx];
                }
            });
            totalRezArr.sort((a,b) => b.glasovi - a.glasovi);
            
            let totalRezHtml = "";
            totalRezArr.forEach((r, index) => {
                totalRezHtml += `
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px; margin-bottom:6px; border:1px solid var(--border-color);">
                    <span style="font-size:13px;"><strong>${index + 1}.</strong> ${r.ime}</span>
                    <span style="font-weight:bold; color:var(--accent-orange); font-size:16px;">${r.glasovi}</span>
                </div>`;
            });

            let totalProc = opstinaUpisano > 0 ? ((opstinaIzaslo/opstinaUpisano)*100).toFixed(1) : 0;

            let finalHtml = `
                <div style="background:var(--bg-card); border:1px solid var(--accent-green); border-radius:12px; padding:15px; margin-bottom:25px;">
                    <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent-green);">ZBIRNO - CELA OPŠTINA</h3>
                    
                    <div style="display:flex; justify-content:space-between; text-align:center; margin-bottom:15px; background:rgba(16, 185, 129, 0.1); border:1px solid rgba(16, 185, 129, 0.3); padding:10px; border-radius:8px;">
                        <div><div style="font-size:11px; color:var(--text-muted);">UPISANO</div><div style="font-weight:bold; font-size:16px;">${opstinaUpisano}</div></div>
                        <div><div style="font-size:11px; color:var(--text-muted);">IZAŠLO</div><div style="font-weight:bold; font-size:16px;">${opstinaIzaslo}</div></div>
                        <div><div style="font-size:11px; color:var(--text-muted);">PROCENAT</div><div style="font-weight:bold; font-size:16px; color:var(--accent-blue);">${totalProc}%</div></div>
                    </div>
                    
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:15px; text-align:center; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
                        Ukupno važećih glasova: <strong style="color:white; font-size:16px;">${ukupnoVazecih}</strong>
                    </div>
                    
                    ${totalRezHtml ? totalRezHtml : '<div style="text-align:center; font-size:12px; color:gray;">Nema unetih rezultata u opštini</div>'}
                </div>
                
                <h3 style="color:var(--text-muted); font-size:16px; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:5px; text-transform:uppercase;">Izveštaj po mestima</h3>
                ${mestaHtml}
            `;

            document.getElementById('izvestaj-content').innerHTML = finalHtml;
        };

        // LOGIKA ZA EKRAN: IZLAZNOST
        window.popuniIzlaznostFormu = function() {
            let id = document.getElementById('select-izlaznost-mesto').value;
            if(!id) return;
            
            let mesto = globalData[id];
            document.getElementById('input-ukupan-broj').value = mesto.ukupan_broj || "";
            document.getElementById('input-izaslo').value = mesto.izaslo || "";
            
            if(mesto.vreme_update) {
                document.getElementById('select-vreme').value = mesto.vreme_update;
            }
            
            document.getElementById('forma-izlaznost').style.display = 'block';
        };

        window.sacuvajIzlaznost = function() {
            let id = document.getElementById('select-izlaznost-mesto').value;
            let upisano = document.getElementById('input-ukupan-broj').value;
            let izaslo = document.getElementById('input-izaslo').value;
            let vreme = document.getElementById('select-vreme').value;

            const updateData = {
                ukupan_broj: parseInt(upisano) || 0,
                izaslo: parseInt(izaslo) || 0,
                vreme_update: vreme
            };

            const btn = document.getElementById('btn-save-izlaznost');
            btn.innerText = "Čuvanje...";
            update(ref(db, 'biracka_mesta/' + id), updateData).then(() => {
                btn.innerText = "Uspešno sačuvano!";
                btn.style.background = "#3b82f6";
                setTimeout(() => { btn.innerText = "Sačuvaj Izlaznost"; btn.style.background = "var(--accent-green)"; }, 2000);
            });
        };

        // LOGIKA ZA EKRAN: REZULTATI
        function generisiPoljaZaStranke() {
            let html = "";
            politickeListe.forEach((ime, idx) => {
                html += `
                    <div class="party-row">
                        <label>${idx + 1}. ${ime}</label>
                        <input type="number" id="rez-${idx}" min="0" placeholder="0">
                    </div>
                `;
            });
            document.getElementById('lista-stranaka').innerHTML = html;
        }

        window.popuniRezultatiFormu = function() {
            let id = document.getElementById('select-rezultati-mesto').value;
            if(!id) return;
            
            let mesto = globalData[id];
            
            politickeListe.forEach((_, idx) => {
                let input = document.getElementById(`rez-${idx}`);
                if (mesto.rezultati && mesto.rezultati[idx] !== undefined) {
                    input.value = mesto.rezultati[idx];
                } else {
                    input.value = "";
                }
            });
            
            document.getElementById('forma-rezultati').style.display = 'block';
        };

        window.sacuvajRezultate = function() {
            let id = document.getElementById('select-rezultati-mesto').value;
            let rezultati = {};
            
            politickeListe.forEach((_, idx) => {
                let val = document.getElementById(`rez-${idx}`).value;
                if(val && val !== "") {
                    rezultati[idx] = parseInt(val);
                }
            });

            const btn = document.getElementById('btn-save-rezultati');
            btn.innerText = "Čuvanje...";
            update(ref(db, 'biracka_mesta/' + id + '/rezultati'), rezultati).then(() => {
                btn.innerText = "Uspešno sačuvano!";
                btn.style.background = "#3b82f6";
                setTimeout(() => { btn.innerText = "Sačuvaj Rezultate"; btn.style.background = "var(--accent-green)"; }, 2000);
            });
        };
    </script>
</body>
</html>
